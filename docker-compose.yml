version: "3.9"

services:
  # PostgreSQL — structured data storage
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: voice_memory
      POSTGRES_USER: voice_user
      POSTGRES_PASSWORD: voice_pass_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voice_user -d voice_memory"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Qdrant — vector database for semantic search
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Ollama — local LLM server for structuring and embeddings
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  # Backend — FastAPI application
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://voice_user:voice_pass_dev@postgres:5432/voice_memory
      AUDIO_STORAGE_PATH: /app/audio_files
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      WHISPER_MODEL: small
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: mistral
      OLLAMA_EMBED_MODEL: nomic-embed-text
      BACKEND_CORS_ORIGINS: http://localhost:3000
    volumes:
      - audio_data:/app/audio_files
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy

  # Frontend — Next.js application
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
  qdrant_data:
  ollama_data:
  audio_data:
